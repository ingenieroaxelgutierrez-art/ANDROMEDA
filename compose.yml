# ============================================================
# ANDROMEDA — Docker Compose DESARROLLO
# Uso: docker compose up
#
# - Código montado como volumen → cambios en tiempo real
# - Backend: uvicorn --reload   → reinicia solo al guardar .py
# - Frontend: next dev          → hot reload al guardar .ts/.tsx
# - NO reconstruir imagen para cambios de código
# - SÍ reconstruir si cambia requirements.txt o package.json:
#     docker compose up --build
# ============================================================

services:

  # ── Backend FastAPI ──────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: andromeda-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Código fuente montado en tiempo real
      - .:/app
      # Persistir datos entre reinicios
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      # node_modules NO se monta (no existe en backend, es solo por claridad)
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      # URL pública que el browser del usuario usa para acceder al backend
      - API_BASE_URL=http://localhost:8000
      # Ollama corre en el host de Windows — desde Docker se accede via host.docker.internal
      - OLLAMA_HOST=http://host.docker.internal:11434
    networks:
      - andromeda-net

  # ── Frontend Next.js ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: andromeda-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Código fuente montado en tiempo real
      - ./frontend:/app
      # Excluir node_modules del host (usar los del contenedor)
      - /app/node_modules
      - /app/.next
    environment:
      # El navegador del usuario accede al backend por localhost (puerto expuesto).
      # "backend" solo es resolvible dentro de la red Docker, no desde el browser.
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - andromeda-net

networks:
  andromeda-net:
    driver: bridge
