name: CI ANDROMEDA

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download es_core_news_sm

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -q --timeout=30 --cov --cov-report=term-missing --cov-fail-under=15

      - name: Syntax check critical files
        run: |
          python -m py_compile views/interfaz_v5.py
          python -m py_compile services/actions/ejecutor_acciones.py
          python -m py_compile services/actions/mapeador_consultas.py
          python -m py_compile core/bot_principal.py
