name: CI ANDROMEDA

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Intentar instalar el modelo spaCy; si falla no abortar todo el job
          python -m pip install es_core_news_sm || python -m spacy download es_core_news_sm || echo "Warning: spaCy model install failed, continuing"

      - name: Run tests with coverage (save logs)
        run: |
          python -m pytest tests/ -q --timeout=120 --cov --cov-report=term-missing --cov-fail-under=15 2>&1 | tee pytest.log

      - name: Upload pytest logs
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log

      - name: Syntax check critical files
        run: |
          python -m py_compile views/interfaz_v5.py
          python -m py_compile services/actions/ejecutor_acciones.py
          python -m py_compile services/actions/mapeador_consultas.py
          python -m py_compile core/bot_principal.py
